# Deploy from the repo root: fly deploy -c apps/agent/fly.toml --remote-only --ha=false   (exactly 1 machine)
# Secrets: fly secrets set -a tab-agent KEY=value (PLAN §11). Never put secrets in [env].
app = "tab-agent"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"
  ignorefile = "Dockerfile.dockerignore"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off" # always on: holds the Photon socket, the due_jobs poller and SSE streams
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    timeout = "3s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
